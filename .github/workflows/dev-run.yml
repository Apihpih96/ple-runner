name: dev-run
# Public runner shell: the harness lives in a private repo. This job checks it
# out with a token, runs dev tasks, and pushes results back to that private
# repo (branch dev-results). Nothing but a short score table appears here.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "comma-separated dev task ids (each runs as its own job, one at a time)"
        default: "wind-diaphragm-shear"
      judge_model:
        description: "judge model served by the local proxy"
        default: "gemma-4-26b"
      ref:
        description: "branch or commit of the private harness"
        default: "main"
      label:
        description: "short label for this run (ablation name)"
        default: "dev"
      mode:
        description: "dev = run tasks; check = kit check --no-smoke (build + listen, no model calls)"
        default: "dev"
      llm:
        description: "auto = Kaggle GPU Gemma if its server is up, else free Gemini key; kaggle = Kaggle only (fail if down); free = free Gemini key"
        default: "auto"
      kaggle_url:
        description: "optional: tunnel URL of the Kaggle server (normally found automatically)"
        default: ""
      wait_min:
        description: "llm=kaggle: minutes to wait for the Kaggle server to come up (it has taken over an hour from Save & Run All)"
        default: "150"
# Runs share one free key, so a new run waits for the one before it.
concurrency:
  group: free-gemini-key
  cancel-in-progress: false
jobs:
  plan:
    # One job per task, one at a time: each job gets its own 6-hour limit and
    # the free key's per-minute quota is never shared between tasks.
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
    steps:
      - id: list
        env:
          TASKS: ${{ inputs.tasks }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = check ]; then echo 'tasks=["check"]' >> "$GITHUB_OUTPUT"; exit 0; fi
          T=$(echo "$TASKS" | tr -d ' ' | sed 's/,,*/,/g; s/^,//; s/,$//; s/,/","/g')
          echo "tasks=[\"$T\"]" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      PRIVATE_REPO: Apihpih96/ple-audited-harness
    steps:
      - name: Check out private harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: harness
      - name: Check out runner scripts
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Free disk space
        # Task images (OpenProject, venv layers) overflowed the default disk.
        # Strip preinstalled toolchains and move Docker's storage to /mnt.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az /usr/local/share/powershell /usr/local/share/chromium || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          docker info --format 'docker root: {{.DockerRootDir}}'
          df -h / /mnt | tail -2; nproc; free -g | head -2
      - name: Install uv, Harbor, PLE kit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install harbor==0.20.0 --with websockets >/dev/null
          git clone -q --depth 1 https://github.com/google-research/ple "$RUNNER_TEMP/ple"
          (cd "$RUNNER_TEMP/ple" && uv sync -q)
      - name: Find Kaggle GPU Gemma server
        if: inputs.llm != 'free'
        env:
          KAGGLE_LLM_PRIVKEY: ${{ secrets.KAGGLE_LLM_PRIVKEY }}
          LLM: ${{ inputs.llm }}
          URL_IN: ${{ inputs.kaggle_url }}
          WAIT_MIN: ${{ inputs.wait_min }}
        run: |
          pip install -q pynacl
          # Kaggle can sit in "Starting..." for an hour before the server publishes.
          # With llm=kaggle wait up to wait_min (runner minutes are free on this
          # public repo; the agent itself needs ~40 min of the 355-min job).
          n=$(( ${WAIT_MIN:-150} * 2 )); t0=$(date +%s)
          ok=1; for i in $(seq 1 $n); do python3 runner/kaggle/endpoint.py --github 2>/dev/null && { ok=0; break; }; [ "$LLM" = kaggle ] || break
            [ $((i % 20)) = 0 ] && echo "still waiting for the Kaggle server ($(( ($(date +%s)-t0)/60 )) min)"; sleep 30; done
          python3 runner/kaggle/endpoint.py >/dev/null || true
          echo "waited $(( ($(date +%s)-t0)/60 )) min for the server"
          if [ $ok = 0 ]; then
            if [ -n "$URL_IN" ]; then echo "::add-mask::$URL_IN"; echo "KAGGLE_LLM_URL=$URL_IN" >> "$GITHUB_ENV"; fi
            echo "model: Kaggle GPU Gemma 4 26B"
          elif [ "$LLM" = kaggle ]; then
            echo "Kaggle server not reachable and llm=kaggle"; exit 1
          else
            echo "model: free Gemini key (16k input tokens/min)"
          fi
      - name: Kit check
        if: inputs.mode == 'check'
        working-directory: harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
        run: |
          set +e
          git fetch -q --unshallow 2>/dev/null
          CHECK_ONLY=1 KIT="$RUNNER_TEMP/ple" bash tools/dev_free.sh > "$RUNNER_TEMP/devrun_full.log" 2>&1
          rc=$?
          grep -E '^\[(PASS|FAIL|WARN|SKIP)\]' "$RUNNER_TEMP/devrun_full.log" | cut -c1-200
          echo "exit code $rc"
      - name: Dev run
        if: inputs.mode != 'check'
        working-directory: harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TASKS: ${{ matrix.task }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
        # Full output goes to a file that is pushed privately; the public log
        # only shows the final score table.
        run: |
          set +e
          # Keepalive: the Kaggle server stops after 75 idle min, and a long
          # task image build makes no model calls. A 1-token request every
          # 20 min counts as activity; it ends with this step.
          if [ -n "${KAGGLE_LLM_URL:-}" ]; then
            ( while sleep 1200; do
                curl -s -m 60 -o /dev/null -H "Authorization: Bearer $KAGGLE_LLM_KEY" -H 'Content-Type: application/json' \
                  -d '{"model":"gemma","messages":[{"role":"user","content":"ok"}],"max_tokens":1}' \
                  "${KAGGLE_LLM_URL%/}/v1/chat/completions" && echo "keepalive $(date -u +%H:%M)" >> "$RUNNER_TEMP/keepalive.log"
              done ) &
            KA=$!
          fi
          KIT="$RUNNER_TEMP/ple" bash tools/dev_free.sh > "$RUNNER_TEMP/devrun_full.log" 2>&1
          rc=$?
          [ -n "${KA:-}" ] && kill $KA 2>/dev/null
          df -h / /mnt | tail -2
          sed -n '/^task  *score/,/^results:/p' "$RUNNER_TEMP/devrun_full.log" | grep -v '^results:'
          echo "exit code $rc"
          exit 0
      - name: Push results to private repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          NAME="$(date -u +%Y%m%d-%H%M%S)-${{ inputs.label }}-${{ matrix.task }}-${GITHUB_RUN_ID}"
          R=$(ls -d "$RUNNER_TEMP"/ple/runs/*/ 2>/dev/null | tail -1 || true)
          cp "$RUNNER_TEMP/devrun_full.log" "$OUT/devrun.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/keepalive.log" "$OUT/" 2>/dev/null || true
          tail -n 200 /tmp/proxy.log > "$OUT/proxy_tail.log" 2>/dev/null || true
          [ -n "$R" ] && cp "$R/results.json" "$OUT/results.json" 2>/dev/null || true
          [ -n "$R" ] && tar -czf "$OUT/run.tar.gz" -C "$R" . 2>/dev/null || true
          # keep under GitHub's 100 MB file limit
          if [ -f "$OUT/run.tar.gz" ] && [ $(stat -c%s "$OUT/run.tar.gz") -gt 95000000 ]; then
            rm "$OUT/run.tar.gz"; echo "run.tar.gz too large, dropped" > "$OUT/NOTE.txt"
          fi
          printf 'tasks=%s\nref=%s\njudge=%s\nrunner_run=%s\n' "${{ matrix.task }}" "${{ inputs.ref }}" "${{ inputs.judge_model }}" "$GITHUB_RUN_ID" > "$OUT/meta.txt"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_REPO}.git"
          mkdir store && cd store && git init -q && git remote add origin "$URL"
          if git fetch -q --depth 1 origin dev-results 2>/dev/null; then
            git checkout -q -b dev-results FETCH_HEAD
          else
            git checkout -q --orphan dev-results && echo "# dev run results" > README.md
          fi
          cd ..
          mkdir -p "store/results/$NAME" && cp -r "$OUT"/. "store/results/$NAME/"
          cd store
          git config user.name "ple-runner"; git config user.email "ple-runner@users.noreply.github.com"
          git add -A && git commit -qm "results $NAME"
          for i in 1 2 3; do git push -q origin dev-results && break; git pull -q --rebase origin dev-results; done
          echo "stored results/$NAME"
